# 静态站点配置。这个容器里没有后端进程，nginx 只发文件。
server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # MIME。mime.types 本身就是一个 types{} 块，所以它只能被 include，不能再套一层
    # types{} —— 那样会得到 `unexpected "{" in /etc/nginx/mime.types:2`，容器起不来。
    # 额外类型另起一个同级的 types{} 块，nginx 会把两个块合并。
    #
    # 实测 nginx:1.27 自带的 mime.types 已经包含 application/wasm wasm（第 55 行），
    # 所以 wasm 不用补；缺的只有 .mjs。
    #
    # .mjs 这条只对「离线部署」那条路径有意义（把 Pyodide 自托管到 web 根下时，
    # pyodide.mjs 会由本容器发出）。默认部署下 Pyodide 来自 CDN，本容器不发任何 .mjs。
    # 但少了它，自托管时浏览器会把 pyodide.mjs 当成 application/octet-stream 而拒绝执行，
    # 页面停在「正在加载运行时」——症状看起来完全像网络故障。
    #
    # .py 按 text/plain 发：内核源码是要被 fetch 成文本读的，octet-stream 也能工作，
    # 但明确写成文本更不容易让人误以为它是可执行内容。
    # ------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        text/javascript mjs;
        text/plain py;
    }

    # ------------------------------------------------------------------
    # 安全头。全部放在 server 级，一个都不放进 location —— 这是刻意的：
    # nginx 的 add_header 不做叠加，只要子级 location 里出现任何一个 add_header，
    # 父级的全部被丢弃。之前这里踩过：location 里写了一条 Cache-Control，
    # 结果整站的安全头静默消失。
    #
    # 所以缓存策略改由 expires -1 表达（它只发 Cache-Control: no-cache，
    # 与 add_header 的继承互不干扰），见下面那个 location。
    #
    # 刻意不加 COOP/COEP：只有 SharedArrayBuffer 需要跨源隔离，而这个负载不用它
    # （取消是靠销毁 Worker 实现的）。加了反而会因为 COEP 要求跨源资源带 CORP 头，
    # 把 CDN 上的 Pyodide 挡掉。
    #
    # CSP 里有三处是必须的，删掉任何一处都会静默地把功能弄坏：
    #   · script-src 'wasm-unsafe-eval' —— 没有它 WebAssembly 实例化被拦，运行时起不来。
    #   · script-src https://cdn.jsdelivr.net —— Worker 从这个 CDN import pyodide.mjs。
    #   · connect-src 里的 blob: —— 通配符 * 只匹配网络 scheme，**不包含 blob:**。
    #     结果图是本页内存里的 blob URL，渲染时要用 fetch 读回像素，所以漏了 blob:
    #     就会得到「预览永远 0×0 + TypeError: Failed to fetch」。这一条在本地开发
    #     （没有 CSP）时完全看不出来，只有过 nginx 才会暴露。
    #   · connect-src * —— 端点地址是用户在页面上自己填的，事先无法枚举。
    #
    # style-src 带 'unsafe-inline' 是权衡后的选择，不是疏忽：页面有 7 处内联 style 属性，
    # 而调色板色块本来就靠内联样式上色，去掉它色块会全部变成透明。样式注入的危害远低于
    # 脚本注入，而 script-src 这边没有任何 'unsafe-inline'，配合全站 textContent 的写法，
    # 注入点本身就不存在。
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src * blob: data:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # ------------------------------------------------------------------
    # 缓存：页面与内核源码每次校验。
    # 没有指纹文件名，所以这些一律 no-cache，避免升级后浏览器还在跑旧代码 ——
    # 那会表现成「改了没生效」这类最难查的问题。
    # 用 expires 而不是 add_header，理由见上面：add_header 会切断安全头的继承。
    # ------------------------------------------------------------------
    location ~* \.(html|css|js|mjs|py)$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
